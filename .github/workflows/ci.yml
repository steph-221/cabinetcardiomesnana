name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Les scripts de guide (scripts/guide/*.cjs) sont de l'outillage local : hors contrôle.
      - name: Lint
        run: npx eslint app proxy.ts
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
